name: GPL Header Check

on:
  pull_request:
  push:
    branches: [ main, master ]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate GPL headers for all tracked sources
        shell: bash
        run: |
          git ls-files -z | python scripts/check_gpl_header.py --stdin -0
      - name: Check docs top-level license footer compliance
        shell: bash
        run: |
          set -euo pipefail
          # 仅检查 docs 顶层“秒时间戳_*.md”，显式传参以符合文档修改授权原则
          find docs -maxdepth 1 -type f -regextype posix-extended -regex 'docs/[0-9]+_.*\.md' -print0 \
            | xargs -0 -r python scripts/insert_docs_license_footer.py --dry-run --check
      - name: Check docs top-level encoding is UTF-8 BOM + LF
        shell: bash
        run: |
          set -euo pipefail
          # 显式传参，仅检查 docs 顶层“秒时间戳_*.md”
          find docs -maxdepth 1 -type f -regextype posix-extended -regex 'docs/[0-9]+_.*\.md' -print0 \
            | xargs -0 -r python scripts/force_docs_utf8_bom.py --check
